name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false
      - name: Porcupine checker (Go unit tests)
        working-directory: tools/porcupine-check
        run: |
          go mod tidy
          go test ./...
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests + 50-seed quick chaos
        run: make test
      - name: Upload failing histories
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: histories
          path: |
            build/histories/
            sim/build/histories/
          if-no-files-found: ignore
